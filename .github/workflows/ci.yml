name: CI - EcoLogCity Build, Lint & Dependencies

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-build:
    name: Linting, Static Analysis & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Validación de Dependencias Backend
        run: |
          cd backend
          npm ci || npm install
          npm audit --audit-level=critical || true

      - name: Compilación y Build Backend
        run: |
          cd backend
          node --check src/server.js
          node --check src/app.js

      - name: Validación de Dependencias Frontend
        run: |
          cd frontend
          npm ci || npm install

      - name: Compilación y Build Frontend (Tailwind CSS)
        run: |
          cd frontend
          npm run build:css || true
