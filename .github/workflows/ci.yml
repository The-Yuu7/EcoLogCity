name: CI - EcoLogCity Build & Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    name: Backend Tests & Coverage (Jest + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ecologcity_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependencias Backend
        run: |
          cd backend
          npm ci || npm install

      - name: Inicializar Esquema de Base de Datos y Seeds
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ecologcity_db -f database/migrations/001_init_postgis_schema.sql
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ecologcity_db -f database/seeds/001_seed_pedidos_huancayo.sql

      - name: Ejecutar Pruebas Automatizadas con Cobertura (DoD >= 80%)
        env:
          PORT: 8000
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecologcity_db
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
        run: |
          cd backend
          npm run test:coverage
