<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoLogCity | Iniciar sesión</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css" />
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-sm">
    <!-- Marca -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <div class="h-12 w-12 bg-white rounded-full flex items-center justify-center text-slate-900 shadow-sm"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 6.5h11v9H3zM14 9.5h3.5l3 3v3H14M7.5 18.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM17 18.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg></div>
      <div>
        <h1 class="text-2xl font-medium tracking-tight text-slate-900">EcoLogCity</h1>
        <p class="text-xs text-slate-500">DistriRápido S.A.C. · Huancayo</p>
      </div>
    </div>

    <!-- Formulario de inicio de sesión (US-007) -->
    <form id="form-login" class="bg-white p-7 rounded-2xl shadow-lg space-y-4">
      <div>
        <h2 class="text-xl font-medium text-slate-900">Iniciar sesión</h2>
        <p class="text-xs text-slate-500 mt-0.5">Ingrese con su cuenta de administrador o usuario.</p>
      </div>

      <div>
        <label for="email" class="block text-xs font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input type="email" id="email" required autocomplete="username" placeholder="usuario@ecologcity.pe"
          class="w-full px-3 py-2.5 text-sm border border-slate-200 bg-slate-50 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none transition" />
      </div>

      <div>
        <label for="password" class="block text-xs font-medium text-slate-700 mb-1">Contraseña</label>
        <div class="relative">
          <input type="password" id="password" required autocomplete="current-password"
            class="w-full pl-3 pr-10 py-2.5 text-sm border border-slate-200 bg-slate-50 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:outline-none transition" />
          <button type="button" id="btn-ver-password" data-visor-para="password"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-slate-400 hover:text-slate-700 transition"
            aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña"></button>
        </div>
      </div>

      <div id="login-error" class="hidden p-2.5 rounded-lg text-xs bg-red-50 text-red-700"></div>

      <button type="submit" id="btn-login"
        class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-full transition">
        Ingresar
      </button>
    </form>

    <p class="text-center text-[11px] text-slate-500 mt-4">EcoLogCity © 2026 · Taller de Proyectos 2</p>
  </div>

  <script src="session.js"></script>
  <script>
    if (obtenerSesion()) window.location.replace('index.html');
    activarVisoresDeContrasena();

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const alerta = document.getElementById('login-error');
      alerta.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const json = await res.json();

        if (!json.ok) {
          alerta.textContent = json.error || 'No se pudo iniciar sesión';
          alerta.classList.remove('hidden');
          return;
        }

        guardarSesion(json.data);
        window.location.replace('index.html');
      } catch (err) {
        alerta.textContent = 'No se pudo conectar con el servidor de EcoLogCity';
        alerta.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
