# ============================================================
# SonarCloud - Configuración del Proyecto EcoLogCity
# Proyecto: Sprint 3 - Análisis de Calidad de Código
# ============================================================

# --- Identificación del Proyecto ---
sonar.projectKey=The-Yuu7_EcoLogCity
sonar.organization=junior
sonar.projectName=EcoLogCity
sonar.projectVersion=3.0.0

# --- Fuentes y Tests ---
sonar.sources=backend/src,frontend/public
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# --- Cobertura de Código (generada por Jest) ---
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# --- Exclusiones ---
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/*.min.js,\
  backend/tests/**,\
  database/**

# --- Test Inclusions ---
sonar.test.inclusions=backend/tests/**/*.test.js,backend/tests/**/*.spec.js

# --- Lenguaje ---
sonar.language=js
